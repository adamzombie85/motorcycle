<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機車筆試好過關 - 自訂騎士角色</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>

  <!-- 頂部通用導覽列 -->
  <header class="site-header">
    <div class="app-container nav-bar">
      <a href="screen-home.html" class="brand-badge" aria-label="返回學習首頁">
        <span class="brand-icon" aria-hidden="true">
          <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
        </span>
        <span class="brand-title-full text-nowrap">機車筆試好過關</span>
        <span class="brand-title-short text-nowrap">好過關</span>
      </a>

      <!-- 學生身分標籤 -->
      <a href="screen-login.html" class="user-chip" title="點擊前往登入或設定身分" style="text-decoration: none; color: inherit;">
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-nowrap">301 班 12 號</span>
      </a>

      <!-- 閱讀設定按鈕 -->
      <a href="screen-settings.html" class="btn-settings" id="btn-reading-settings" aria-label="開啟閱讀設定面板" title="開啟閱讀設定面板">
        <span class="btn-settings-icon" aria-hidden="true">
          <svg class="icon icon-md" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        <span class="btn-settings-text btn-settings-text-full text-nowrap">閱讀設定</span>
        <span class="btn-settings-text btn-settings-text-short text-nowrap">設定</span>
      </a>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">

      <!-- 頁面頂部導航 -->
      <nav aria-label="麵包屑導航" style="margin-bottom: var(--space-2);">
        <a href="screen-home.html" style="color: var(--color-primary-700); font-size: var(--font-size-sm); text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 4px;">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          <span>回首頁</span>
        </a>
      </nav>

      <div style="margin-bottom: var(--space-6);">
        <h1 style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-black); color: var(--color-slate-900);">
          選擇你的騎士搭檔
        </h1>
        <p style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-top: 4px;">
          選擇你喜愛的騎士風格，他將出現在學習首頁、地圖路段與成果報告中陪伴你！
        </p>
      </div>

      <!-- 6 位騎士角色網格 -->
      <section class="character-grid" aria-label="騎士角色選擇清單">

        <!-- 角色 6：金色安全帽 -->
        <div class="character-card is-active" tabindex="0" role="radio" aria-checked="true">
          <div class="character-avatar-box"><img src="../site/assets/illustrations/rider-6.png" alt="金色安全帽" style="width: 72px; height: 72px; object-fit: contain;"></div>
          <h2 class="character-name" style="margin-top: 8px; color: var(--color-slate-600);">金色安全帽</h2>
          <p class="character-desc">象徵全方位精熟的最高榮譽。</p>
          <div class="character-unlock-badge">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>取得「月度車神」解鎖 (3/30天)</span>
          </div>
        </div>

      </section>

      <!-- 底部儲存與返回 -->
      <div style="display: flex; justify-content: center; gap: var(--space-4); margin-top: var(--space-8);">
        <a href="screen-home.html" class="btn btn-primary btn-lg">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span>儲存並返回首頁</span>
        </a>
      </div>

    </div>
  </main>

  <!-- 頁尾宣告 -->
  <footer style="background-color: var(--color-bg-card); border-top: 1px solid var(--color-border-subtle); padding: var(--space-6) 0; text-align: center; color: var(--color-text-secondary); font-size: var(--font-size-sm);">
    <div class="app-container">
      <p>© 2026 41 研究室｜版權所有</p>
      <p style="margin-top: 4px; color: var(--color-text-muted);">通用無障礙設計規範落實 · 支援手機與平板觸控</p>
    </div>
  </footer>

</body>
</html>
